[package]
name = "waystation"
version = "0.2.0"
edition = "2024"
description = "A project-aware terminal workflow hub"
license = "MIT"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
crossterm = "0.29"
ratatui = "0.30.2"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
toml = "0.9"
nix = { version = "0.31.3", features = ["process", "signal", "fs", "term", "socket", "user", "poll"] }
alacritty_terminal = "0.26"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
glob = "0.3"
unicode-width = "0.2"

[dev-dependencies]
tempfile = "3"
insta = "1"

[profile.release]
lto = "thin"
strip = true
